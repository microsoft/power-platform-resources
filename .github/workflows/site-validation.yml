name: Validate site

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check generated About content
        run: node scripts/update-about.js --check

      - name: Run regression tests
        run: node --test tests/ssp-search.test.js

      - name: Check patch whitespace
        run: git diff --check
